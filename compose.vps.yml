name: afraz-vps

services:
  app:
    image: ${AFRAZ_IMAGE:?AFRAZ_IMAGE must be set}
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

    ports:
      - "127.0.0.1:5080:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"
