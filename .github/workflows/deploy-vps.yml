name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve immutable image reference
        id: image
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${IMAGE_TAG}"
          echo "ref=${image}" >> "$GITHUB_OUTPUT"

      - name: Validate deployment Compose file
        shell: bash
        env:
          AFRAZ_IMAGE: ${{ steps.image.outputs.ref }}
          ASPNETCORE_ENVIRONMENT: Production
        run: docker compose -f compose.vps.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ steps.image.outputs.ref }}

      # Keep GHCR as the registry/archive, but the VPS will NOT pull from it.
      - name: Log in to GHCR from GitHub runner
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        shell: bash
        env:
          AFRAZ_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -Eeuo pipefail
          docker push "$AFRAZ_IMAGE"

      - name: Export Docker image for VPS
        shell: bash
        env:
          AFRAZ_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -Eeuo pipefail
          docker image inspect "$AFRAZ_IMAGE" >/dev/null
          docker save "$AFRAZ_IMAGE" | gzip -1 > afraz-app-image.tar.gz
          test -s afraz-app-image.tar.gz
          ls -lh afraz-app-image.tar.gz

      - name: Prepare VPS transfer directory
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            rm -rf /tmp/afraz-deploy
            mkdir -p /tmp/afraz-deploy

      - name: Copy Docker image to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: afraz-app-image.tar.gz
          target: /tmp/afraz-deploy

      - name: Encode deployment Compose file
        id: compose
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "content=$(base64 < compose.vps.yml | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Load image and deploy on VPS
        uses: appleboy/ssh-action@v1.2.4
        env:
          AFRAZ_IMAGE: ${{ steps.image.outputs.ref }}
          COMPOSE_FILE_BASE64: ${{ steps.compose.outputs.content }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          envs: AFRAZ_IMAGE,COMPOSE_FILE_BASE64
          script: |
            set -eu

            echo "== 1/8 Checking variables =="
            : "${AFRAZ_IMAGE:?Missing image reference}"
            : "${COMPOSE_FILE_BASE64:?Missing Compose configuration}"
            echo "Image: $AFRAZ_IMAGE"

            deploy_dir="${HOME}/afraz-vps"
            compose_file="${deploy_dir}/compose.vps.yml"
            env_file="${deploy_dir}/.env"
            image_archive="/tmp/afraz-deploy/afraz-app-image.tar.gz"

            echo "== 2/8 Preparing deployment directory =="
            mkdir -p "$deploy_dir"

            if [ ! -f "$env_file" ]; then
              echo "ERROR: Missing VPS .env: $env_file"
              exit 1
            fi

            if [ ! -s "$image_archive" ]; then
              echo "ERROR: Image archive not found: $image_archive"
              exit 1
            fi

            echo "== 3/8 Checking Docker =="
            docker --version
            docker compose version
            if ! docker info >/dev/null 2>&1; then
              echo "ERROR: SSH user cannot access Docker daemon"
              exit 1
            fi

            echo "== 4/8 Updating Compose file =="
            if ! printf '%s' "$COMPOSE_FILE_BASE64" | base64 --decode > "${compose_file}.tmp"; then
              echo "ERROR: Failed to decode Compose file"
              rm -f "${compose_file}.tmp"
              exit 1
            fi
            mv "${compose_file}.tmp" "$compose_file"

            cd "$deploy_dir"
            export AFRAZ_IMAGE

            echo "== 5/8 Validating Compose =="
            if ! docker compose \
              --project-name afraz-vps \
              --env-file "$env_file" \
              --file "$compose_file" \
              config --quiet; then
              echo "ERROR: Invalid Compose configuration"
              exit 1
            fi

            echo "== 6/8 Loading transferred Docker image =="
            if ! gzip -dc "$image_archive" | docker load; then
              echo "ERROR: docker load failed"
              exit 1
            fi

            if ! docker image inspect "$AFRAZ_IMAGE" >/dev/null 2>&1; then
              echo "ERROR: Loaded image not found: $AFRAZ_IMAGE"
              exit 1
            fi

            echo "== 7/8 Starting app without registry pull =="
            if ! docker compose \
              --project-name afraz-vps \
              --env-file "$env_file" \
              --file "$compose_file" \
              up --detach --no-deps --pull never app; then
              echo "ERROR: docker compose up failed"
              exit 1
            fi

            sleep 5

            echo "== 8/8 Verifying container =="
            container_id="$(docker compose \
              --project-name afraz-vps \
              --env-file "$env_file" \
              --file "$compose_file" \
              ps --quiet app)"

            if [ -z "$container_id" ]; then
              echo "ERROR: No container found for service app"
              docker compose \
                --project-name afraz-vps \
                --env-file "$env_file" \
                --file "$compose_file" \
                ps || true
              exit 1
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]; then
              echo "ERROR: App container is not running"
              docker inspect \
                --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' \
                "$container_id" || true
              echo "== Last container logs =="
              docker logs --tail 100 "$container_id" || true
              exit 1
            fi

            rm -rf /tmp/afraz-deploy
            docker image prune --force >/dev/null 2>&1 || true

            echo "Container ID: $container_id"
            echo "== DEPLOY SUCCESS =="
