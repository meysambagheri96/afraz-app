name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      AFRAZ_IMAGE: afraz-app:${{ github.sha }}
      IMAGE_ARCHIVE: afraz-app-image.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment Compose file
        shell: bash
        run: |
          set -Eeuo pipefail
          AFRAZ_IMAGE="$AFRAZ_IMAGE" docker compose -f compose.vps.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.AFRAZ_IMAGE }}

      - name: Export Docker image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker image inspect "$AFRAZ_IMAGE" >/dev/null
          docker save "$AFRAZ_IMAGE" | gzip -1 > "$IMAGE_ARCHIVE"
          test -s "$IMAGE_ARCHIVE"
          ls -lh "$IMAGE_ARCHIVE"

      - name: Prepare VPS transfer directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            rm -rf /tmp/afraz-deploy
            mkdir -p /tmp/afraz-deploy

      - name: Copy image and Compose file to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "afraz-app-image.tar.gz,compose.vps.yml"
          target: "/tmp/afraz-deploy"

      - name: Load and deploy on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          AFRAZ_IMAGE: ${{ env.AFRAZ_IMAGE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          envs: AFRAZ_IMAGE
          script: |
            set -eu

            echo "== 1/6 Checking Docker =="
            docker --version
            docker compose version
            docker info >/dev/null

            deploy_dir="${HOME}/afraz-vps"
            transfer_dir="/tmp/afraz-deploy"
            compose_file="${deploy_dir}/compose.vps.yml"
            image_archive="${transfer_dir}/afraz-app-image.tar.gz"

            echo "== 2/6 Preparing deployment files =="
            mkdir -p "$deploy_dir"

            test -s "$image_archive"
            test -s "${transfer_dir}/compose.vps.yml"

            cp "${transfer_dir}/compose.vps.yml" "$compose_file"

            echo "== 3/6 Loading Docker image =="
            gzip -dc "$image_archive" | docker load
            docker image inspect "$AFRAZ_IMAGE" >/dev/null

            echo "== 4/6 Validating Compose configuration =="
            cd "$deploy_dir"
            export AFRAZ_IMAGE

            docker compose \
              --project-name afraz-vps \
              --file "$compose_file" \
              config --quiet

            echo "== 5/6 Starting app =="
            docker compose \
              --project-name afraz-vps \
              --file "$compose_file" \
              up --detach --no-deps --pull never app

            sleep 5

            echo "== 6/6 Verifying container =="
            container_id="$(
              docker compose \
                --project-name afraz-vps \
                --file "$compose_file" \
                ps --quiet app
            )"

            if [ -z "$container_id" ]; then
              echo "ERROR: app container was not created"
              docker compose \
                --project-name afraz-vps \
                --file "$compose_file" \
                ps || true
              exit 1
            fi

            running="$(docker inspect --format '{{.State.Running}}' "$container_id")"

            if [ "$running" != "true" ]; then
              echo "ERROR: app container is not running"
              docker inspect \
                --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' \
                "$container_id" || true

              echo "== Last application logs =="
              docker logs --tail 100 "$container_id" || true
              exit 1
            fi

            echo "Container is running: $container_id"

            rm -rf "$transfer_dir"

            echo "== DEPLOY SUCCESS =="
